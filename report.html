<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test Report Viewer</title>
  <style>
    :root {
      --header: #16324f;
      --header-2: #1f4668;
      --accent: #2b9ad4;
      --chrome: #d9e2ec;
      --panel: #ffffff;
      --line: #c5d0dc;
      --guide: #b7c4d1;
      --text: #1a202c;
      --muted: #5a6a7a;
      --pass: #2f855a;
      --fail: #c53030;
      --skip: #718096;
      --none: #a0aec0;
      --pass-bg: #c6f6d5;
      --fail-bg: #fed7d7;
      --skip-bg: #edf2f7;
      --sel: #d6eaf8;
      --row-alt: #f7fafc;
      --folder: #d69e2e;
      --font: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
      --mono: "Cascadia Mono", "Consolas", "Microsoft YaHei Mono", monospace;
      --tree-w: 340px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--chrome); color: var(--text); font: 13px/1.45 var(--font); }
    body { display: flex; flex-direction: column; min-height: 100vh; }
    button, input, select { font: inherit; }
    .titlebar {
      background: linear-gradient(180deg, var(--header-2), var(--header));
      color: #fff; display: flex; align-items: center; gap: 12px;
      padding: 8px 14px; min-height: 42px;
    }
    .logo {
      width: 22px; height: 22px; border-radius: 3px;
      background: var(--accent); display: grid; place-items: center;
      font-weight: 700; font-size: 12px; color: #083344;
    }
    .titlebar h1 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: .02em; }
    .titlebar .file { color: #cfe8f7; font-weight: 400; margin-left: 4px; }
    .toolbar {
      background: #eef3f8; border-bottom: 1px solid var(--line);
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 6px 10px;
    }
    .toolbar .group { display: flex; align-items: center; gap: 6px; }
    .seg { display: flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: #fff; }
    .seg button { border: 0; background: transparent; padding: 4px 10px; cursor: pointer; color: var(--muted); }
    .seg button + button { border-left: 1px solid var(--line); }
    .seg button.active { background: var(--header); color: #fff; }
    .search { border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; min-width: 220px; }
    .ghost { border: 1px solid var(--line); background: #fff; border-radius: 4px; padding: 4px 10px; cursor: pointer; }
    .ghost:hover { background: #f7fafc; }
    .workspace { flex: 1; display: grid; grid-template-columns: var(--tree-w) 6px 1fr; min-height: 0; }
    .tree-pane, .content-pane { background: var(--panel); min-height: 0; overflow: auto; }
    .tree-pane { display: flex; flex-direction: column; }
    .splitter { background: var(--chrome); cursor: col-resize; border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
    .splitter:hover, .splitter.drag { background: var(--accent); }
    .pane-title {
      background: #f4f7fa; border-bottom: 1px solid var(--line);
      padding: 6px 10px; font-weight: 600; color: var(--header); letter-spacing: .04em;
      text-transform: uppercase; font-size: 11px; display: flex; justify-content: space-between;
    }
    .tree { padding: 4px 8px 16px 4px; }
    .tree ul { list-style: none; margin: 0; padding: 0 0 0 14px; position: relative; }
    .tree > ul { padding-left: 6px; }
    .tree li { position: relative; }
    .tree ul::before {
      content: ""; position: absolute; left: 6px; top: 0; bottom: 10px;
      border-left: 1px solid var(--guide);
    }
    .tree > ul::before { display: none; }
    .tree li::before {
      content: ""; position: absolute; left: -8px; top: 13px; width: 12px;
      border-top: 1px solid var(--guide);
    }
    .tree li:last-child::after {
      content: ""; position: absolute; left: -8px; top: 14px; bottom: 0; width: 2px; background: var(--panel);
    }
    .node-row {
      display: flex; align-items: center; gap: 5px; padding: 2px 6px 2px 2px;
      cursor: pointer; border-radius: 3px; min-height: 22px; white-space: nowrap;
    }
    .node-row:hover { background: #f0f7fb; }
    .node-row.selected { background: var(--sel); }
    .twisty {
      width: 14px; flex: 0 0 14px; text-align: center; color: var(--muted);
      font-size: 10px; line-height: 1;
    }
    .twisty.empty { visibility: hidden; }
    .ico { width: 14px; height: 14px; flex: 0 0 14px; }
    .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .kind { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .04em; flex: 0 0 auto; }
    .count { color: var(--muted); font-size: 11px; margin-left: auto; padding-left: 8px; flex: 0 0 auto; }
    .hidden { display: none !important; }
    .content { padding: 14px 18px 28px; }
    .crumb { color: var(--muted); margin-bottom: 8px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
    .crumb button {
      border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0;
    }
    .crumb button:hover { text-decoration: underline; }
    .crumb .sep { color: var(--guide); }
    .head {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
      border-bottom: 1px solid var(--line); padding-bottom: 10px; margin-bottom: 14px;
    }
    .head h2 { margin: 0 0 4px; font-size: 18px; font-weight: 650; }
    .meta { color: var(--muted); }
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      border-radius: 3px; padding: 4px 10px; font-weight: 700; letter-spacing: .06em;
      text-transform: uppercase; font-size: 12px; border: 1px solid transparent;
    }
    .v-pass { background: var(--pass-bg); color: var(--pass); border-color: #9ae6b4; }
    .v-fail { background: var(--fail-bg); color: var(--fail); border-color: #feb2b2; }
    .v-skip { background: var(--skip-bg); color: var(--skip); border-color: #cbd5e0; }
    .v-none { background: #edf2f7; color: var(--none); border-color: #e2e8f0; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin: 12px 0 16px; }
    .card { border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; background: #fff; }
    .card h3 { margin: 0 0 8px; font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; }
    .nums { display: flex; gap: 10px; flex-wrap: wrap; }
    .nums span { font-weight: 650; }
    .bar { height: 8px; background: #edf2f7; border-radius: 99px; overflow: hidden; display: flex; margin-top: 8px; }
    .bar i { display: block; height: 100%; }
    .bar .p { background: var(--pass); }
    .bar .f { background: var(--fail); }
    .bar .s { background: var(--skip); }
    table.grid { width: 100%; border-collapse: collapse; border: 1px solid var(--line); }
    table.grid th, table.grid td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
    table.grid th { background: #f4f7fa; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
    table.grid tbody tr:nth-child(even) { background: var(--row-alt); }
    table.grid tbody tr.clickable { cursor: pointer; }
    table.grid tbody tr.clickable:hover { background: #eef6fb; }
    table.grid tbody tr.flash { outline: 2px solid var(--accent); }
    .kv { width: 100%; border-collapse: collapse; }
    .kv th { width: 180px; text-align: left; color: var(--muted); font-weight: 600; padding: 4px 8px 4px 0; }
    .kv td { padding: 4px 0; }
    .section { margin: 18px 0 8px; font-size: 13px; font-weight: 700; color: var(--header); display: flex; align-items: center; gap: 8px; }
    .section .hint { font-weight: 500; color: var(--muted); font-size: 12px; }
    .step-text .static { color: #2b6cb0; font-weight: 650; }
    .step-text .dynamic { color: #805ad5; font-weight: 650; }
    .step-text .special { color: #c05621; }
    .err { color: var(--fail); white-space: pre-wrap; font-family: var(--mono); font-size: 12px; }
    .msg { color: var(--muted); white-space: pre-wrap; }
    .stack { white-space: pre-wrap; font-family: var(--mono); font-size: 11px; background: #f7fafc; border: 1px solid var(--line); padding: 8px; overflow: auto; }
    .tree-cell { display: flex; align-items: stretch; gap: 0; min-width: 88px; }
    .indent-block { display: inline-block; flex: 0 0 auto; height: 8px; }
    .guides { display: inline-flex; align-items: stretch; min-height: 22px; }
    .guides i { position: relative; width: 16px; flex: 0 0 16px; }
    .g-bar::before, .g-mid::before { content: ""; position: absolute; left: 8px; top: 0; bottom: 0; border-left: 1px solid var(--guide); }
    .g-mid::after, .g-end::after { content: ""; position: absolute; left: 8px; top: 12px; width: 8px; border-top: 1px solid var(--guide); }
    .g-end::before { content: ""; position: absolute; left: 8px; top: 0; height: 13px; border-left: 1px solid var(--guide); }
    .guides .twisty { cursor: pointer; color: var(--muted); width: 14px; }
    tr.row-concept { background: #eef5fb; }
    tr.depth-1 { background: #f7fafc; }
    tr.depth-1 td:first-child, tr.depth-2 td:first-child, tr.depth-3 td:first-child {
      box-shadow: inset 3px 0 0 var(--accent);
    }
    .shots { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
    .shots img { max-width: 240px; max-height: 160px; border: 1px solid var(--line); background: #fff; }
    .tags { display: flex; gap: 4px; flex-wrap: wrap; }
    .tag { background: #ebf8ff; color: #2b6cb0; border: 1px solid #bee3f8; border-radius: 3px; padding: 0 6px; font-size: 11px; }
    .empty { color: var(--muted); padding: 24px; text-align: center; }
    .status {
      background: #eef3f8; border-top: 1px solid var(--line);
      padding: 4px 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 12px;
    }
    .data-table { margin: 6px 0; }
    @media (max-width: 900px) {
      .workspace { grid-template-columns: 1fr; }
      .splitter { display: none; }
      .tree-pane { max-height: 36vh; border-bottom: 1px solid var(--line); }
    }
    @media print {
      .titlebar, .toolbar, .tree-pane, .splitter, .status { display: none !important; }
      .workspace { display: block; }
      body { background: #fff; }
    }
  </style>
</head>
<body>
  <header class="titlebar">
    <div class="logo">TR</div>
    <h1>Test Report Viewer <span class="file" id="title-file"></span></h1>
  </header>
  <div class="toolbar">
    <div class="group">
      <span>Verdict</span>
      <div class="seg" id="filters">
        <button data-filter="all" class="active">All</button>
        <button data-filter="fail">Fail</button>
        <button data-filter="pass">Pass</button>
        <button data-filter="skip">Skip</button>
      </div>
    </div>
    <input class="search" id="search" placeholder="Search specs / scenarios / steps" type="search">
    <button class="ghost" id="expand-all" type="button">Expand All</button>
    <button class="ghost" id="collapse-all" type="button">Collapse All</button>
    <button class="ghost" id="print" type="button">Print</button>
  </div>
  <div class="workspace">
    <aside class="tree-pane">
      <div class="pane-title"><span>Execution Tree</span><span id="tree-hint">suite / folder / spec / case</span></div>
      <div class="tree" id="tree"></div>
    </aside>
    <div class="splitter" id="splitter" title="Resize"></div>
    <main class="content-pane">
      <div class="content" id="content"></div>
    </main>
  </div>
  <footer class="status">
    <span id="status-left">Ready</span>
    <span id="status-right"></span>
  </footer>
  <script type="application/json" id="report-data">{{REPORT_JSON}}</script>
  <script>
    const report = JSON.parse(document.getElementById('report-data').textContent);
    const state = { filter: 'all', query: '', selected: 'suite', open: new Set(['suite']), collapsed: new Set() };
    const index = { nodes: {}, crumbs: {} };
    const $ = (id) => document.getElementById(id);

    function verdictLabel(v) {
      return ({ pass: 'Pass', fail: 'Fail', skip: 'Skip', none: 'None' })[v] || 'None';
    }
    function worse(a, b) {
      const rank = { fail: 3, skip: 2, none: 1, pass: 0 };
      return (rank[a] || 0) >= (rank[b] || 0) ? a : b;
    }
    function addCounts(a, b) {
      return { total: a.total + b.total, passed: a.passed + b.passed, failed: a.failed + b.failed, skipped: a.skipped + b.skipped };
    }
    function emptyCounts() { return { total: 0, passed: 0, failed: 0, skipped: 0 }; }
    function specFolders(spec) {
      if (spec.folders && spec.folders.length) return spec.folders;
      const f = String(spec.fileName || '').replace(/\\/g, '/');
      const parts = f.split('/');
      parts.pop();
      return parts.filter(p => p && p !== '.');
    }
    function typeIcon(kind, verdict) {
      const color = { pass: '#2f855a', fail: '#c53030', skip: '#718096', none: '#a0aec0' }[verdict] || '#5a6a7a';
      const icons = {
        suite: `<rect x="3" y="3" width="10" height="10" rx="1.5" fill="none" stroke="${color}" stroke-width="1.5"/><path d="M3 7h10M8 3v10" stroke="${color}" stroke-width="1.2"/>`,
        folder: `<path d="M2.5 5.5h4l1.2 1.5H13.5v6.5H2.5z" fill="none" stroke="${color}" stroke-width="1.5"/><path d="M2.5 7.2h11" stroke="${color}" stroke-width="1.2"/>`,
        spec: `<path d="M4.5 2.5h5l3 3V13.5h-8z" fill="none" stroke="${color}" stroke-width="1.5"/><path d="M9.5 2.5V6h3" stroke="${color}" stroke-width="1.2"/>`,
        scenario: `<circle cx="8" cy="8" r="5.4" fill="none" stroke="${color}" stroke-width="1.5"/><path d="M6.6 5.6l4.2 2.4-4.2 2.4z" fill="${color}"/>`,
        concept: `<rect x="2.5" y="4" width="8" height="8" rx="1" fill="none" stroke="${color}" stroke-width="1.4"/><rect x="5.5" y="2.5" width="8" height="8" rx="1" fill="none" stroke="${color}" stroke-width="1.4"/>`,
        step: `<circle cx="8" cy="8" r="5.2" fill="none" stroke="${color}" stroke-width="1.5"/><path d="M5.5 8h5" stroke="${color}" stroke-width="1.5" stroke-linecap="round"/>`,
        comment: `<path d="M3 4h10v7H7l-3 2.5z" fill="none" stroke="${color}" stroke-width="1.4"/>`,
        phase: `<path d="M3 8h10M8 3v10" stroke="${color}" stroke-width="1.4" stroke-linecap="round"/>`
      };
      return `<svg class="ico" viewBox="0 0 16 16" aria-hidden="true">${icons[kind] || icons.step}</svg>`;
    }
    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function tags(list) {
      if (!list || !list.length) return '';
      return `<div class="tags">${list.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>`;
    }
    function badge(v) { return `<span class="badge v-${esc(v)}">${esc(verdictLabel(v))}</span>`; }
    function countBar(c) {
      const t = Math.max(c.total, 1);
      return `<div class="bar"><i class="p" style="width:${100*c.passed/t}%"></i><i class="f" style="width:${100*c.failed/t}%"></i><i class="s" style="width:${100*c.skipped/t}%"></i></div>`;
    }
    function matchQuery(text) {
      const q = state.query.trim().toLowerCase();
      if (!q) return true;
      return String(text || '').toLowerCase().includes(q);
    }
    function itemText(item) {
      if (!item) return '';
      if (item.kind === 'comment') return item.comment || '';
      if (item.kind === 'step' && item.step) return item.step.actualText || item.step.parsedText || '';
      if (item.kind === 'concept' && item.concept && item.concept.step) return item.concept.step.actualText || item.concept.step.parsedText || '';
      return '';
    }
    function itemVerdict(item) {
      if (item.kind === 'step' && item.step) return item.step.verdict;
      if (item.kind === 'concept' && item.concept && item.concept.step) return item.concept.step.verdict;
      return 'none';
    }
    function walkItems(items, fn) {
      (items || []).forEach(item => {
        fn(item);
        if (item.kind === 'concept' && item.concept) walkItems(item.concept.items, fn);
      });
    }
    function scenarioAllItems(scn) {
      return [].concat(scn.contexts || [], scn.items || [], scn.teardowns || []);
    }
    function scenarioTexts(scn) {
      const texts = [scn.heading, ...(scn.tags || [])];
      walkItems(scenarioAllItems(scn), item => texts.push(itemText(item)));
      return texts;
    }
    function nodeVisible(verdict, texts) {
      if (state.filter !== 'all' && verdict !== state.filter) return false;
      if (!state.query.trim()) return true;
      return texts.some(matchQuery);
    }
    function subtreeVisible(node) {
      if (node.kind === 'item') {
        return nodeVisible(itemVerdict(node.item), [itemText(node.item), node.label].concat(node.extraTexts || []));
      }
      const selfHit = nodeVisible(node.verdict, node.texts || [node.label]);
      const kids = (node.children || []).filter(subtreeVisible);
      node.visibleChildren = kids;
      if (state.filter === 'all' && !state.query.trim()) return true;
      return selfHit || kids.length > 0;
    }

    function buildItemNodes(items, crumbs) {
      return (items || []).map(item => {
        const label = itemText(item) || (item.kind === 'comment' ? 'Comment' : 'Step');
        const children = item.kind === 'concept' && item.concept ? buildItemNodes(item.concept.items, crumbs.concat({ id: item.id, label })) : [];
        const node = {
          id: item.id, kind: 'item', itemKind: item.kind, item, label, verdict: itemVerdict(item),
          children, crumbs: crumbs.concat({ id: item.id, label }), texts: [label]
        };
        index.nodes[node.id] = node;
        return node;
      });
    }
    function buildScenarioNode(spec, scn) {
      const children = [];
      if ((scn.contexts || []).length) {
        const id = scn.id + '-phase-ctx';
        const n = { id, kind: 'phase', label: 'Context', verdict: 'none', children: buildItemNodes(scn.contexts, [{ id: spec.id, label: spec.heading }, { id: scn.id, label: scn.heading }, { id, label: 'Context' }]), texts: ['Context'] };
        index.nodes[id] = n;
        children.push(n);
      }
      children.push.apply(children, buildItemNodes(scn.items, [{ id: spec.id, label: spec.heading }, { id: scn.id, label: scn.heading }]));
      if ((scn.teardowns || []).length) {
        const id = scn.id + '-phase-td';
        const n = { id, kind: 'phase', label: 'Teardown', verdict: 'none', children: buildItemNodes(scn.teardowns, [{ id: spec.id, label: spec.heading }, { id: scn.id, label: scn.heading }, { id, label: 'Teardown' }]), texts: ['Teardown'] };
        index.nodes[id] = n;
        children.push(n);
      }
      const node = {
        id: scn.id, kind: 'scenario', spec, scn, label: scn.heading, verdict: scn.verdict,
        children, count: null, crumbs: [{ id: 'suite', label: report.projectName }, { id: spec.id, label: spec.heading }, { id: scn.id, label: scn.heading }],
        texts: scenarioTexts(scn)
      };
      index.nodes[scn.id] = node;
      return node;
    }
    function buildSpecNode(spec) {
      const children = (spec.scenarios || []).map(scn => buildScenarioNode(spec, scn));
      const node = {
        id: spec.id, kind: 'spec', spec, label: spec.heading, verdict: spec.verdict,
        children, count: spec.summary, crumbs: [{ id: 'suite', label: report.projectName }, { id: spec.id, label: spec.heading }],
        texts: [spec.heading, spec.fileName].concat(spec.tags || [])
      };
      index.nodes[spec.id] = node;
      return node;
    }
    function buildFolderForest() {
      index.nodes = { suite: null };
      const root = { id: 'suite', kind: 'suite', label: report.projectName, verdict: report.verdict, children: [], folders: {}, count: report.summary.scenarios, crumbs: [{ id: 'suite', label: report.projectName }], texts: [report.projectName] };
      index.nodes.suite = root;
      (report.specs || []).forEach(spec => {
        let parent = root;
        const folders = specFolders(spec);
        const trail = [];
        folders.forEach(name => {
          trail.push(name);
          const id = 'folder:' + trail.join('/');
          if (!parent.folders) parent.folders = {};
          if (!parent.folders[name]) {
            const node = { id, kind: 'folder', label: name, path: trail.join('/'), parent, verdict: 'pass', children: [], folders: {}, count: emptyCounts(), crumbs: [{ id: 'suite', label: report.projectName }].concat(trail.map((_, i) => ({ id: 'folder:' + trail.slice(0, i + 1).join('/'), label: trail[i] }))), texts: [name, trail.join('/')] };
            parent.folders[name] = node;
            parent.children.push(node);
            index.nodes[id] = node;
          }
          parent = parent.folders[name];
        });
        const specNode = buildSpecNode(spec);
        specNode.crumbs = parent.crumbs.concat([{ id: spec.id, label: spec.heading }]);
        specNode.parent = parent;
        parent.children.push(specNode);
        let roll = parent;
        while (roll && roll.kind === 'folder') {
          roll.verdict = worse(roll.verdict, spec.verdict);
          roll.count = addCounts(roll.count, spec.summary || emptyCounts());
          roll = roll.parent;
        }
      });
      return root;
    }
    const forest = buildFolderForest();
    Object.keys(index.nodes).forEach(id => {
      const n = index.nodes[id];
      if (n && n.kind === 'folder') state.open.add(id);
    });

    function hasKids(node) { return (node.visibleChildren || node.children || []).length > 0; }
    function kids(node) { return node.visibleChildren || node.children || []; }
    function countLabel(node) {
      const c = node.count;
      if (!c || !c.total) return '';
      return `${c.passed}/${c.total}`;
    }
    function kindLabel(node) {
      return ({ suite: 'suite', folder: 'folder', spec: 'spec', scenario: 'case', phase: 'group', item: node.itemKind || 'step' })[node.kind] || '';
    }
    function renderNode(node) {
      if (!subtreeVisible(node) && node.id !== 'suite') return '';
      const open = state.open.has(node.id);
      const children = kids(node);
      const twisty = children.length ? (open ? '▾' : '▸') : '';
      const iconKind = node.kind === 'item' ? (node.itemKind || 'step') : node.kind;
      let html = `<li><div class="node-row ${state.selected===node.id?'selected':''}" data-id="${esc(node.id)}">
        <span class="twisty ${children.length ? '' : 'empty'}">${twisty}</span>
        ${typeIcon(iconKind, node.verdict)}
        <span class="label">${esc(node.label)}</span>
        <span class="kind">${esc(kindLabel(node))}</span>
        ${countLabel(node) ? `<span class="count">${esc(countLabel(node))}</span>` : ''}
      </div>`;
      if (open && children.length) {
        html += `<ul>${children.map(renderNode).join('')}</ul>`;
      }
      return html + '</li>';
    }
    function renderTree() {
      subtreeVisible(forest);
      forest.visibleChildren = (forest.children || []).filter(subtreeVisible);
      $('tree').innerHTML = `<ul>${renderNode(forest)}</ul>`;
    }
    function ancestorsOf(id) {
      const ids = ['suite'];
      const node = index.nodes[id];
      if (!node || !node.crumbs) return ids;
      node.crumbs.forEach(c => ids.push(c.id));
      return ids;
    }
    function select(id, opts) {
      if (!index.nodes[id]) id = 'suite';
      state.selected = id;
      ancestorsOf(id).forEach(a => state.open.add(a));
      const node = index.nodes[id];
      if (node && (node.kind === 'scenario' || node.kind === 'phase' || node.kind === 'item')) {
        collectExpandIds(node, state.open, null);
      }
      renderTree();
      renderContent();
      if (opts && opts.scrollStep) {
        const row = document.querySelector(`tr[data-step-id="${CSS.escape(id)}"]`);
        if (row) {
          row.classList.add('flash');
          row.scrollIntoView({ block: 'center' });
          setTimeout(() => row.classList.remove('flash'), 1200);
        }
      }
    }
    function crumbHtml(node) {
      const crumbs = (node && node.crumbs) || [{ id: 'suite', label: report.projectName }];
      return `<div class="crumb">${crumbs.map((c, i) => `${i ? '<span class="sep">/</span>' : ''}<button type="button" data-id="${esc(c.id)}">${esc(c.label)}</button>`).join('')}</div>`;
    }
    function hookBlock(h) {
      if (!h) return '';
      return `<div class="card" style="border-color:#feb2b2">
        <h3>${esc(h.hookName)} failed</h3>
        <div class="err">${esc(h.errorMessage)}</div>
        ${h.stackTrace ? `<pre class="stack">${esc(h.stackTrace)}</pre>` : ''}
        ${shotList(h.failureScreenshot ? [h.failureScreenshot] : [])}
      </div>`;
    }
    function shotList(paths) {
      const list = (paths || []).filter(Boolean);
      if (!list.length) return '';
      return `<div class="shots">${list.map(p => `<a href="${esc(p)}" target="_blank"><img src="${esc(p)}" alt="screenshot"></a>`).join('')}</div>`;
    }
    function dataTable(t) {
      if (!t || !t.headers) return '';
      const head = `<tr>${t.headers.map(h => `<th>${esc(h)}</th>`).join('')}</tr>`;
      const rows = (t.rows || []).map(r => `<tr>${(r||[]).map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('');
      return `<table class="grid data-table"><thead>${head}</thead><tbody>${rows}</tbody></table>`;
    }
    function stepText(step) {
      if (!step) return '';
      if (step.fragments && step.fragments.length) {
        return step.fragments.map(f => {
          if (f.kind === 'text') return esc(f.text);
          if (f.kind === 'table') return `<div>${dataTable(f.table)}</div>`;
          if (f.kind === 'multiline') return `<pre class="stack">${esc(f.text)}</pre>`;
          return `<span class="${esc(f.kind)}">${esc(f.text)}</span>`;
        }).join('');
      }
      return esc(step.actualText || step.parsedText || '');
    }
    function flattenSteps(items, depth, rows, lastFlags) {
      const list = items || [];
      list.forEach((item, i) => {
        const last = i === list.length - 1;
        const flags = lastFlags.concat([last]);
        if (item.kind === 'comment') {
          rows.push({ id: item.id, type: 'Comment', depth, lastFlags: flags, text: esc(item.comment), verdict: 'none', duration: '', extra: '', expandable: false });
          return;
        }
        if (item.kind === 'step' && item.step) {
          rows.push(Object.assign(stepRow('Step', item.step, depth, item.id), { lastFlags: flags, expandable: false }));
          return;
        }
        if (item.kind === 'concept' && item.concept) {
          const collapsed = state.collapsed.has(item.id);
          rows.push(Object.assign(stepRow('Concept', item.concept.step, depth, item.id), { lastFlags: flags, expandable: true, collapsed, childCount: (item.concept.items || []).length }));
          if (!collapsed) flattenSteps(item.concept.items, depth + 1, rows, flags);
        }
      });
    }
    function stepRow(type, step, depth, id) {
      const extra = [
        step && step.errorMessage ? `<div class="err">${esc(step.errorMessage)}</div>` : '',
        step && step.skippedReason ? `<div class="msg">Skipped: ${esc(step.skippedReason)}</div>` : '',
        ((step && step.messages) || []).map(m => `<div class="msg">${esc(m)}</div>`).join(''),
        step && step.stackTrace ? `<pre class="stack">${esc(step.stackTrace)}</pre>` : '',
        step ? hookBlock(step.preHookFailure) : '',
        step ? hookBlock(step.postHookFailure) : '',
        step ? shotList([step.failureScreenshot].concat(step.screenshots || []).concat(step.preHookScreenshots || []).concat(step.postHookScreenshots || [])) : ''
      ].join('');
      return { id, type, depth, text: `<span class="step-text">${stepText(step)}</span>`, verdict: (step && step.verdict) || 'none', duration: (step && step.duration) || '', extra };
    }
    function guideHtml(row) {
      const flags = row.lastFlags || [];
      let html = '<span class="guides">';
      flags.forEach((last, i) => {
        const isLeaf = i === flags.length - 1;
        let cls = 'g-pad';
        if (!isLeaf) cls = last ? 'g-pad' : 'g-bar';
        else cls = last ? 'g-end' : 'g-mid';
        html += `<i class="${cls}"></i>`;
      });
      html += '</span>';
      if (row.expandable) html += `<span class="twisty" data-toggle="${esc(row.id)}">${row.collapsed ? '▸' : '▾'}</span>`;
      else if (row.depth) html += `<span class="twisty empty">·</span>`;
      return html;
    }
    function stepsTable(items, title, hint) {
      const rows = [];
      flattenSteps(items, 0, rows, []);
      if (!rows.length) return '';
      return `<div class="section">${esc(title)}${hint ? `<span class="hint">${esc(hint)}</span>` : ''}</div>
        <table class="grid"><thead><tr><th>#</th><th>Hierarchy</th><th>Type</th><th>Description</th><th>Verdict</th><th>Duration</th></tr></thead><tbody>${
          rows.map((r, i) => `<tr class="depth-${r.depth} row-${esc(r.type.toLowerCase())}" data-step-id="${esc(r.id || '')}"><td>${i+1}</td><td class="tree-cell"><span class="indent-block" style="width:${(r.depth||0)*28}px"></span>${guideHtml(r)}</td><td>${esc(r.type)}</td><td class="desc" style="padding-left:${8 + (r.depth||0)*20}px">${r.text}${r.extra}</td><td>${badge(r.verdict)}</td><td>${esc(r.duration)}</td></tr>`).join('')
        }</tbody></table>`;
    }
    function collectFolderSpecs(node, out) {
      (node.children || []).forEach(ch => {
        if (ch.kind === 'spec') out.push(ch.spec);
        if (ch.kind === 'folder') collectFolderSpecs(ch, out);
      });
      return out;
    }
    function renderSuiteLike(node, specs) {
      const s = node.count || report.summary.scenarios;
      return `
        ${crumbHtml(node)}
        <div class="head"><div><h2>${esc(node.label)}</h2><div class="meta">${node.kind === 'suite' ? `${esc(report.timestamp)} · ${esc(report.duration)}` : esc(node.path || node.label)}</div></div>${badge(node.verdict)}</div>
        ${node.kind === 'suite' ? `<table class="kv">
          <tr><th>Environment</th><td>${esc(report.environment || '-')}</td></tr>
          <tr><th>Tags</th><td>${esc(report.tags || '-')}</td></tr>
          <tr><th>Success rate</th><td>${Number(report.successRate || 0).toFixed(2)}%</td></tr>
          <tr><th>Started</th><td>${esc(report.timestampISO || report.timestamp)}</td></tr>
        </table>` : ''}
        <div class="stats">
          ${node.kind === 'suite' ? statCard('Specifications', report.summary.specs) : ''}
          ${statCard('Test Cases', s)}
          ${node.kind === 'suite' ? statCard('Test Steps', report.summary.steps) : ''}
        </div>
        ${node.kind === 'suite' ? hookBlock(report.preHookFailure) + hookBlock(report.postHookFailure) : ''}
        <div class="section">Specifications</div>
        <table class="grid"><thead><tr><th>Name</th><th>Path</th><th>Cases</th><th>Verdict</th><th>Duration</th></tr></thead>
        <tbody>${specs.map(spec => `<tr class="clickable" data-id="${esc(spec.id)}"><td>${esc(spec.heading)}</td><td>${esc((spec.folders||[]).concat([spec.heading]).join(' / '))}</td><td>${spec.summary.passed}/${spec.summary.total}</td><td>${badge(spec.verdict)}</td><td>${esc(spec.duration)}</td></tr>`).join('')}</tbody></table>`;
    }
    function statCard(title, c) {
      c = c || emptyCounts();
      return `<div class="card"><h3>${esc(title)}</h3>
        <div class="nums"><span>${c.total} total</span><span style="color:var(--pass)">${c.passed} pass</span><span style="color:var(--fail)">${c.failed} fail</span><span style="color:var(--skip)">${c.skipped} skip</span></div>
        ${countBar(c)}</div>`;
    }
    function renderSpec(spec) {
      const node = index.nodes[spec.id];
      return `
        ${crumbHtml(node)}
        <div class="head"><div><h2>${esc(spec.heading)}</h2><div class="meta">${esc(spec.fileName)} · ${esc(spec.duration)}</div>${tags(spec.tags)}</div>${badge(spec.verdict)}</div>
        ${statCard('Test Cases', spec.summary)}
        ${(spec.errors||[]).map(e => `<div class="err">${esc(e.type)}: ${esc(e.fileName)}:${e.lineNumber} ${esc(e.message)}</div>`).join('')}
        ${(spec.preHookFailures||[]).concat(spec.postHookFailures||[]).map(hookBlock).join('')}
        ${spec.datatable ? `<div class="section">Data Table</div>${dataTable(spec.datatable)}` : ''}
        <div class="section">Test Cases</div>
        <table class="grid"><thead><tr><th>Name</th><th>Tags</th><th>Verdict</th><th>Duration</th></tr></thead>
        <tbody>${(spec.scenarios||[]).map(scn => `<tr class="clickable" data-id="${esc(scn.id)}"><td>${esc(scn.heading)}</td><td>${tags(scn.tags)}</td><td>${badge(scn.verdict)}</td><td>${esc(scn.duration)}</td></tr>`).join('')}</tbody></table>`;
    }
    function renderScenario(spec, scn) {
      const node = index.nodes[scn.id];
      return `
        ${crumbHtml(node)}
        <div class="head"><div><h2>${esc(scn.heading)}</h2><div class="meta">${esc(scn.duration)}${scn.retriesCount ? ' · retries ' + scn.retriesCount : ''}</div>${tags(scn.tags)}</div>${badge(scn.verdict)}</div>
        ${hookBlock(scn.preHookFailure)}${hookBlock(scn.postHookFailure)}
        ${(scn.skipErrors||[]).map(e => `<div class="msg">${esc(e)}</div>`).join('')}
        ${scn.scenarioDataTable ? `<div class="section">Scenario Data Table</div>${dataTable(scn.scenarioDataTable)}` : ''}
        ${stepsTable(scn.contexts, 'Context', 'before scenario')}
        ${stepsTable(scn.items, 'Test Steps', 'scenario body')}
        ${stepsTable(scn.teardowns, 'Teardown', 'after scenario')}
        ${!(scn.contexts||[]).length && !(scn.items||[]).length && !(scn.teardowns||[]).length ? '<div class="empty">No test steps</div>' : ''}`;
    }
    function renderPhase(node) {
      const spec = findSpecFor(node);
      const scn = findScenarioFor(node);
      if (scn) return renderScenario(spec, scn);
      return renderSuiteLike(forest, report.specs || []);
    }
    function findSpecFor(node) {
      if (node.spec) return node.spec;
      const specCrumb = (node.crumbs || []).map(c => index.nodes[c.id]).find(n => n && n.kind === 'spec');
      return specCrumb && specCrumb.spec;
    }
    function findScenarioFor(node) {
      if (node.scn) return node.scn;
      const scnCrumb = (node.crumbs || []).map(c => index.nodes[c.id]).find(n => n && n.kind === 'scenario');
      return scnCrumb && scnCrumb.scn;
    }
    function renderContent() {
      const node = index.nodes[state.selected] || forest;
      let html = '';
      if (node.kind === 'spec') html = renderSpec(node.spec);
      else if (node.kind === 'scenario') html = renderScenario(node.spec, node.scn);
      else if (node.kind === 'phase' || node.kind === 'item') {
        const spec = findSpecFor(node);
        const scn = findScenarioFor(node);
        html = scn ? renderScenario(spec, scn) : renderSuiteLike(forest, report.specs || []);
      } else if (node.kind === 'folder') html = renderSuiteLike(node, collectFolderSpecs(node, []));
      else html = renderSuiteLike(forest, report.specs || []);
      $('content').innerHTML = html;
      $('status-left').textContent = node.label;
      const s = report.summary;
      $('status-right').textContent = `Specs ${s.specs.passed}/${s.specs.total} · Cases ${s.scenarios.passed}/${s.scenarios.total} · Steps ${s.steps.passed}/${s.steps.total} · ${report.duration}`;
      if (node.kind === 'item' || node.kind === 'phase') {
        const row = document.querySelector(`tr[data-step-id="${CSS.escape(node.id)}"]`);
        if (row) { row.classList.add('flash'); row.scrollIntoView({ block: 'center' }); }
      }
    }
    function collectExpandIds(node, into, untilKind) {
      into.add(node.id);
      (node.children || []).forEach(ch => {
        if (untilKind && ch.kind === untilKind) { into.add(ch.id); return; }
        collectExpandIds(ch, into, untilKind);
      });
    }
    $('tree').addEventListener('click', (e) => {
      const row = e.target.closest('.node-row');
      if (!row) return;
      const id = row.getAttribute('data-id');
      if (e.target.closest('.twisty') && id) {
        if (state.open.has(id)) state.open.delete(id); else state.open.add(id);
        renderTree();
        return;
      }
      const node = index.nodes[id];
      select(id, { scrollStep: node && (node.kind === 'item' || node.kind === 'phase') });
    });
    $('content').addEventListener('click', (e) => {
      const toggle = e.target.closest('[data-toggle]');
      if (toggle) {
        const id = toggle.getAttribute('data-toggle');
        if (state.collapsed.has(id)) state.collapsed.delete(id); else state.collapsed.add(id);
        renderContent();
        return;
      }
      const crumb = e.target.closest('.crumb button[data-id]');
      if (crumb) { select(crumb.getAttribute('data-id')); return; }
      const row = e.target.closest('tr.clickable');
      if (row && row.dataset.id) select(row.dataset.id);
    });
    $('filters').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-filter]');
      if (!btn) return;
      state.filter = btn.dataset.filter;
      [...$('filters').querySelectorAll('button')].forEach(b => b.classList.toggle('active', b === btn));
      renderTree();
    });
    $('search').addEventListener('input', (e) => { state.query = e.target.value; renderTree(); });
    $('expand-all').addEventListener('click', () => {
      const ids = new Set();
      collectExpandIds(forest, ids, 'scenario');
      state.open = ids;
      renderTree();
    });
    $('collapse-all').addEventListener('click', () => { state.open = new Set(); renderTree(); });
    $('print').addEventListener('click', () => window.print());
    (function splitter() {
      const el = $('splitter');
      let start = 0, width = 0, dragging = false;
      el.addEventListener('mousedown', (e) => {
        dragging = true; start = e.clientX; width = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--tree-w'), 10) || 340;
        el.classList.add('drag');
        e.preventDefault();
      });
      window.addEventListener('mousemove', (e) => {
        if (!dragging) return;
        const next = Math.max(220, Math.min(560, width + e.clientX - start));
        document.documentElement.style.setProperty('--tree-w', next + 'px');
      });
      window.addEventListener('mouseup', () => { dragging = false; el.classList.remove('drag'); });
    })();
    document.title = 'Test Report Viewer - ' + (report.projectName || 'report');
    $('title-file').textContent = '— ' + (report.projectName || '');
    renderTree();
    renderContent();
  </script>
</body>
</html>
