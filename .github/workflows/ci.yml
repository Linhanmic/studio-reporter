name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Check frontend asset sync
        run: make check-assets
      - name: Vet
        run: go vet ./...
      - name: Test with coverage
        run: ./scripts/cover-summary.sh
      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cover-profile
          path: cover.out
          if-no-files-found: ignore
      - name: Build
        run: go build -o /tmp/studio-reporter .
      - name: Shared discover package tests
        run: |
          cd packages/studio-reporter-discover
          npm test
      - name: Desktop unit tests
        run: |
          cd desktop
          npm ci
          npm test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2
